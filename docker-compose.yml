services:
  api:
    build: .
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      PANDA_TRACE_STORE: persistent
      PANDA_TRACE_API_HOST: ${PANDA_TRACE_API_HOST:-0.0.0.0}
      PANDA_TRACE_API_PORT: ${PANDA_TRACE_API_PORT:-8000}
      PANDA_TRACE_API_PUBLISH_HOST: ${PANDA_TRACE_API_PUBLISH_HOST:-127.0.0.1}
      PANDA_TRACE_API_PUBLISH_PORT: ${PANDA_TRACE_API_PUBLISH_PORT:-8000}
      PANDA_TRACE_SERVICE_PUBLISH_HOST: ${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}
      RATE_LIMIT_BACKEND: redis
      TAIL_BACKEND: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-panda_trace}
      POSTGRES_USER: ${POSTGRES_USER:-panda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-panda_trace}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-panda}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-panda}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-panda}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-panda-secret}
    ports:
      - "${PANDA_TRACE_API_PUBLISH_HOST:-127.0.0.1}:${PANDA_TRACE_API_PUBLISH_PORT:-8000}:${PANDA_TRACE_API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panda_trace}
      POSTGRES_USER: ${POSTGRES_USER:-panda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panda}
    ports:
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda_trace"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-panda_trace}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-panda}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-panda}
    ports:
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:8123:8123"
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-panda}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-panda-secret}
    ports:
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:9000:9000"
      - "${PANDA_TRACE_SERVICE_PUBLISH_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
